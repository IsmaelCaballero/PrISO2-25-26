spring:
  application:
    name: iso2-server
  datasource:
    url: jdbc:h2:file:./data/iso2-server;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Desde CFG-01 el esquema no lo crea Hibernate: lo versiona Flyway (db/migration).
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
