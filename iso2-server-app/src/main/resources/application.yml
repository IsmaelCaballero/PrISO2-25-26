spring:
  application:
    name: iso2-server
  datasource:
    url: jdbc:h2:file:./data/iso2-server;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Desde CFG-01 el esquema no lo crea Hibernate: lo versiona Flyway (db/migration).
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

# CDU17 (CFG-02): el secreto JWT no vive en el repositorio; se inyecta SOLO por la
# variable de entorno ISO2_JWT_SECRET (minimo 32 bytes para HS256). Sin ella, la
# aplicacion falla al arrancar a proposito (JwtUtils hace fail-fast).
#   PowerShell:  $env:ISO2_JWT_SECRET = "una-frase-larga-de-pista-compartida-segura"
iso2:
  seguridad:
    jwt:
      secret: ${ISO2_JWT_SECRET:}
      duracion-minutos: 60

server:
  port: 8080
